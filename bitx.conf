# Configuração Oficial do Nó BitX Core (BTXC) - PRODUÇÃO MAINNET
# Conglomerado: Engecema Fomento e Tecnologia & Corretora Global Exchange
# Fornecimento Máximo: 1.500.000.000 BTXC
# Algoritmo: PoW SHA-256d | Formato: Native SegWit Bech32 (btxc1...)

# Rede e Conectividade de Produção
server=1
listen=1
mainnet=1
txindex=1

# Nós Seed Globais e Gateway da Corretora Global Exchange
addnode=seed1.bitxcore.org:8333
addnode=seed2.bitxcore.org:8333
addnode=gateway.globalexchange.com:8333
addnode=node.globalexchange.com:8333
addnode=globalexchange.com:8333
addnode=custody-br.engecema.com:8333
addnode=engecema.com:8333

# Autenticação e Ligação RPC para Serviços de Custódia e Global Exchange
rpcbind=0.0.0.0
rpcuser=bitx_mainnet_admin
rpcpassword=btxc_prod_sec_auth_2026!
rpcport=8332
port=8333

# Liberar conexões na rede interna do Render
rpcallowip=127.0.0.1
rpcallowip=10.0.0.0/8
rpcallowip=172.16.0.0/12
rpcallowip=0.0.0.0/0

# Mempool e Política de Taxas
minrelaytxfee=0.00001000
fallbackfee=0.00020000
blockmaxweight=4000000
daemon=1
