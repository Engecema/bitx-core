<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BitX Core - Painel de Acesso</title><link rel="icon" type="image/png" href="website/favicon.png">
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}body{background-color:#0b0f19;color:#f3f4f6;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}.container{background-color:#111827;border:1px solid #1f2937;border-radius:12px;padding:40px;width:100%;max-width:450px;box-shadow:0 10px 25px rgba(0,0,0,0.5);}.header{text-align:center;margin-bottom:30px;}.header h1{color:#3b82f6;font-size:28px;font-weight:700;margin-bottom:8px;}.header p{color:#9ca3af;font-size:14px;}.info-box{background-color:#1f2937;border-left:4px solid #3b82f6;padding:12px;border-radius:4px;margin-bottom:25px;font-size:13px;}.info-row{display:flex;justify-content:between;margin-bottom:6px;}.info-label{color:#9ca3af;}.info-value{font-weight:600;color:#e5e7eb;}.form-group{margin-bottom:20px;}.form-group label{display:block;margin-bottom:8px;font-size:14px;color:#9ca3af;}.form-group input{width:100%;padding:12px 16px;background-color:#1f2937;border:1px solid #374151;border-radius:6px;color:#f3f4f6;font-size:15px;outline:none;}.form-group input:focus{border-color:#3b82f6;}.btn-login{width:100%;padding:14px;background-color:#3b82f6;border:none;border-radius:6px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:10px;}.btn-login:hover{background-color:#2563eb;}.error-message{color:#ef4444;font-size:13px;margin-top:8px;text-align:center;display:none;}.success-panel{display:none;text-align:center;}</style></head><body>
<div class="container" id="loginContainer"><div class="header"><h1>BitX Core (BTXC)</h1><p>Painel de Acesso à Configuração</p></div><div class="info-box"><div class="info-row"><span class="info-label">Fornecimento Máximo: </span><span class="info-value">1.500.000.000</span></div><div class="info-row"><span class="info-label">Rede: </span><span class="info-value">Independente</span></div></div>
            <div class="form-group"><label for="rpcToken">Chave de Acesso RPC (Token)</label><input type="password" id="rpcToken" required placeholder="Digite o token da blockchain"></div>
<form id="loginForm" onsubmit="handleLogin(event)"><div class="form-group"><label for="username">Usuário Administrador</label><input type="text" id="username" required placeholder="Digite o usuário"></div>
<div class="form-group"><label for="password">Senha de Segurança</label><input type="password" id="password" required placeholder="Digite a senha"></div>
<button type="submit" class="btn-login">Conectar à Rede</button><div class="error-message" id="errorMessage">Credenciais ou Token inválidos.</div></form></div>
<div class="container success-panel" id="dashboardContainer"><h2>Conexão Estabelecida</h2><p style="margin-bottom:20px;color:#9ca3af;">Ambiente administrativo do BitX Core.</p><div class="info-box" style="text-align:left;"><p><strong>Status do Nó:</strong> Online</p><p><strong>Conexão RPC:</strong> Ativa</p></div><button class="btn-login" style="background-color:#4b5563;" onclick="window.location.reload()">Desconectar</button></div>
<script>function handleLogin(e){e.preventDefault();const u=document.getElementById("username").value;const p=document.getElementById("password").value;const t=document.getElementById("rpcToken").value;const err=document.getElementById("errorMessage");if(u==="admin"&&p==="bitx123"&&t.length>4){err.style.display="none";document.getElementById("loginContainer").style.display="none";document.getElementById("dashboardContainer").style.display="block";}else{err.style.display="block";}}</script></body></html>
