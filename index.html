<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BitX Core - Painel</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}body{background-color:#0b0f19;color:#f3f4f6;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}.container{background-color:#111827;border:1px solid #1f2937;border-radius:12px;padding:30px;width:100%;max-width:500px;box-shadow:0 10px 25px rgba(0,0,0,0.5);}.header{text-align:center;margin-bottom:20px;}.header h1{color:#3b82f6;font-size:26px;font-weight:700;}.info-box{background-color:#1f2937;border-left:4px solid #3b82f6;padding:12px;border-radius:4px;margin-bottom:20px;font-size:13px;}.info-row{display:flex;justify-content:space-between;margin-bottom:6px;}.form-group{margin-bottom:15px;}.form-group label{display:block;margin-bottom:6px;font-size:14px;color:#9ca3af;}.form-group input{width:100%;padding:10px 14px;background-color:#1f2937;border:1px solid #374151;border-radius:6px;color:#f3f4f6;outline:none;}.btn-login{width:100%;padding:12px;background-color:#3b82f6;border:none;border-radius:6px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:5px;}.btn-login:hover{background-color:#2563eb;}.error-message{color:#ef4444;font-size:13px;margin-top:8px;text-align:center;display:none;}.success-panel{display:none;}.user-item{display:flex;justify-content:space-between;align-items:center;background:#1f2937;padding:8px 12px;margin-bottom:8px;border-radius:6px;font-size:14px;}.btn-del{background:#ef4444;border:none;color:#fff;padding:4px 8px;border-radius:4px;cursor:pointer;font-size:12px;}</style></head><body>
<div class="container" id="loginContainer"><div class="header"><h1>BitX Core (BTXC)</h1><p>Painel de Acesso à Configuração</p></div><div class="info-box"><div class="info-row"><span>Fornecimento Máximo:</span><span>1.500.000.000</span></div><div class="info-row"><span>Rede:</span><span>Independente</span></div></div>
<form id="loginForm" onsubmit="handleLogin(event)"><div class="form-group"><label for="rpcToken">Chave de Acesso RPC (Token)</label><input type="password" id="rpcToken" required placeholder="Digite o token"></div>
<div class="form-group"><label for="username">Usuário Administrador</label><input type="text" id="username" required placeholder="Digite o usuário"></div>
<div class="form-group"><label for="password">Senha de Segurança</label><input type="password" id="password" required placeholder="Digite a senha"></div>
<button type="submit" class="btn-login">Conectar à Rede</button><div class="error-message" id="errorMessage">Credenciais ou Token inválidos.</div></form></div>
<div class="container success-panel" id="dashboardContainer"><h2>Configurações de Credenciais</h2><p style="margin-bottom:15px;color:#9ca3af;font-size:14px;">Gerencie os usuários cadastrados no banco de dados contínuo do BitX.</p>
<div style="margin-bottom:20px;border-top:1px solid #1f2937;padding-top:15px;"><h3 style="font-size:16px;margin-bottom:10px;color:#3b82f6;">Adicionar / Alterar Usuário</h3>
<div class="form-group"><input type="text" id="newuser" placeholder="Novo usuário"></div><div class="form-group"><input type="password" id="newpass" placeholder="Nova senha"></div>
<button class="btn-login" style="background:#10b981;" onclick="saveUser()">Gravar Credencial</button></div>
<div style="margin-bottom:20px;"><h3 style="font-size:16px;margin-bottom:10px;color:#3b82f6;">Usuários Ativos</h3><div id="usersList"></div></div>
<button class="btn-login" style="background-color:#4b5563;" onclick="window.location.reload()">Desconectar</button></div>
<script>const api="https://github.dev";
async function handleLogin(e){e.preventDefault();const u=document.getElementById("username").value;const p=document.getElementById("password").value;const err=document.getElementById("errorMessage");try{const res=await fetch(api,{method:"POST",body:JSON.stringify({action:"login",user:u,password:p})});const d=await res.json();if(d.status==="success"){err.style.display="none";document.getElementById("loginContainer").style.display="none";document.getElementById("dashboardContainer").style.display="block";loadUsers();}else{err.innerText="Usuário ou senha incorretos.";err.style.display="block";}}catch(k){err.innerText="Servidor desconectado.";err.style.display="block";}}
async function loadUsers(){try{const res=await fetch(api,{method:"POST",body:JSON.stringify({action:"list"})});const d=await res.json();const box=document.getElementById("usersList");box.innerHTML="";d.users.forEach(u=>{box.innerHTML+=`<div class="user-item"><span>${u}</span><button class="btn-del" onclick="deleteUser('${u}')">Remover</button></div>`;});}catch(e){}}
async function saveUser(){const u=document.getElementById("newuser").value;const p=document.getElementById("newpass").value;if(!u||!p)return;try{await fetch(api,{method:"POST",body:JSON.stringify({action:"save",user:u,password:p})});document.getElementById("newuser").value="";document.getElementById("newpass").value="";loadUsers();}catch(e){}}
async function deleteUser(u){try{await fetch(api,{method:"POST",body:JSON.stringify({action:"delete",user:u})});loadUsers();}catch(e){}}</script></body></html>
